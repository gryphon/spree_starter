services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - 'postgres:/var/lib/postgresql/data'
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DB_HOST: postgres
    ports:
      - "3000:3000"
    volumes:
      - ./:/rails

volumes:
  postgres: